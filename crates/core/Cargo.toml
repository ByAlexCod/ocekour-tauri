[package]
name = "ocekour-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cœur d'Ocekour : sources, flux, S3, MCP, services — indépendant de toute interface."

[features]
default = []
# Faux serveurs (Rancher, services) : tests et démonstrations.
testing = ["dep:rcgen"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
saphyr-parser = "0.2"
regex = "1"
fancy-regex = "0.19"
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream", "query", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
parking_lot = "0.12"
once_cell = "1"
notify = "8"
dirs = "6"
quick-xml = { version = "0.38", features = ["serialize"] }
percent-encoding = "2"
kafka-protocol = { version = "0.18", default-features = false, features = ["client", "broker", "gzip", "zstd", "snappy", "lz4"] }
apache-avro = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
htmd = "0.5"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
tokio-tungstenite = "0.30"
tokio-postgres = "0.7"
tokio-util = { version = "0.7", features = ["compat", "io"] }
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "chrono"] }
oracle-rs = "0.1"
unicode-normalization = "0.1"
toml_edit = "0.23"
crc32c = "0.6"
encoding_rs = "0.8"
rcgen = { version = "0.14", optional = true }
tokio-stream = "0.1"
tokio-postgres-rustls = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
rcgen = "0.14"
