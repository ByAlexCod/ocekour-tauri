name: build

on:
  push:
  workflow_dispatch:

jobs:
  # Cœur, mode sans interface et interface : tests avec de vrais Kafka, S3 (moto) et PostgreSQL.
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
        ports: ['15432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances système de Tauri (WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Broker Kafka de test
        run: scripts/kafka-test-broker.sh "$RUNNER_TEMP/kafka"
      - name: Broker Kafka 3.0 de test (protocole sans ids de topics)
        run: scripts/kafka-legacy-broker.sh "$RUNNER_TEMP/kafka-legacy"
      - name: S3 de test (moto)
        run: scripts/s3-test-server.sh "$RUNNER_TEMP/s3"
      - name: Base PostgreSQL de test
        run: PGPASSWORD=secret psql -h 127.0.0.1 -p 15432 -U postgres -f scripts/pg-test-fixture.sql
      - run: npm ci
        working-directory: ui
      - name: Interface (svelte-check, vitest, build)
        working-directory: ui
        run: npm run check && npm test && npm run build
      - name: Rust (cœur, sans interface, application)
        run: cargo test --workspace
        env:
          KAFKA_TEST_BROKER: localhost:19092
          KAFKA_TEST_LEGACY_BROKER: localhost:19192
          S3_TEST_URL: http://localhost:19000
          BDD_TEST_PG: 127.0.0.1:15432
          OCEKOUR_BROWSER_PATH: /usr/bin/google-chrome

  # Exe Windows : un seul ocekour.exe (WebView2 du système), plus l'installateur NSIS.
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Construction (tauri build)
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build
        env:
          # Exe diffusé : clés d'activation de production seulement (docs/cles-activation.md).
          OCEKOUR_RELEASE: '1'
          LICENCE_OBFUSCATION: ${{ secrets.LICENCE_OBFUSCATION }}
      - name: ocekour-headless.exe (serveur MCP / notifications sans WebView2)
        run: cargo build --release -p ocekour-headless
        env:
          OCEKOUR_RELEASE: '1'
          LICENCE_OBFUSCATION: ${{ secrets.LICENCE_OBFUSCATION }}
      - name: Paquet à diffuser (exe + docs)
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p package/docs
          cp target/release/ocekour.exe "package/Ocekour-$VERSION.exe"
          cp target/release/ocekour-headless.exe package/
          cp target/release/bundle/nsis/*.exe package/ || true
          cp docs/guide/*.md package/docs/ 2>/dev/null || true
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v5
        with:
          name: Ocekour-${{ env.VERSION }}
          path: package/
          if-no-files-found: error

  # Sonde et mode sans interface pour Linux : binaire statique (musl), sans aucune dépendance,
  # à copier tel quel sur un serveur (RHEL, Debian, Alpine…).
  linux:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: musl-gcc (ring)
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: ocekour-headless (statique)
        run: cargo build --release -p ocekour-headless --target x86_64-unknown-linux-musl
        env:
          OCEKOUR_RELEASE: '1'
          LICENCE_OBFUSCATION: ${{ secrets.LICENCE_OBFUSCATION }}
      - name: Vérification (statique, démarre)
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/ocekour-headless
          file "$BIN" | grep -q 'static'
          "$BIN" --version
          "$BIN" sonde init --dossier="$RUNNER_TEMP/sonde" --ecoute=127.0.0.1:0 --nom=ci
      - name: Paquet
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p package
          cp target/x86_64-unknown-linux-musl/release/ocekour-headless package/
          cp docs/guide/sonde.md package/ 2>/dev/null || true
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v5
        with:
          name: ocekour-headless-linux-x86_64-${{ env.VERSION }}
          path: package/
          if-no-files-found: error
