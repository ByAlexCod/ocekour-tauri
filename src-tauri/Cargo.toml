[package]
name = "ocekour"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ocekour : interface de bureau (Tauri) au-dessus du cœur ocekour-core."
default-run = "ocekour"

[lib]
name = "ocekour_app"
path = "src/lib.rs"

[[bin]]
name = "ocekour"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Mêmes fonctionnalités que ocekour-headless : le cœur n'est compilé qu'une fois pour les deux exe
# (le code de démonstration inutilisé est retiré à l'édition de liens).
ocekour-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
async-trait = "0.1"
once_cell = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Mode Edge (WebView2 indisponible) : serveur local de l'interface, et ce que les plugins
# Tauri apportent à la fenêtre (mêmes bibliothèques, déjà compilées pour eux).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
bytes = "1"
tokio-stream = "0.1"
parking_lot = "0.12"
rfd = { version = "0.16", default-features = false }
arboard = { version = "3", default-features = false }
notify-rust = { version = "4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
# Mêmes versions que wry (vérification du runtime WebView2 au démarrage).
webview2-com = "0.39"
windows-core = "0.62"

[features]
# Construit pour `tauri dev` / `tauri build` (protocole personnalisé de production).
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
