[workspace]
resolver = "3"
members = ["crates/core", "crates/headless", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "UNLICENSED"
authors = ["Ocekour"]

[workspace.dependencies]
ocekour-core = { path = "crates/core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
log = { version = "0.4", features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
